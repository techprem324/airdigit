<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10" />
      <stop offset="50%" stop-color="#141824" />
      <stop offset="100%" stop-color="#0e1017" />
    </linearGradient>

    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb300" />
      <stop offset="50%" stop-color="#ffd200" />
      <stop offset="100%" stop-color="#fff5be" />
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0088ff" />
      <stop offset="100%" stop-color="#00d2ff" />
    </linearGradient>

    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseReticle {
      0%, 100% { r: 18px; opacity: 0.9; }
      50% { r: 24px; opacity: 0.4; }
    }
    @keyframes sweepGrid {
      0% { transform: translateY(0); }
      100% { transform: translateY(320px); }
    }
    @keyframes sparkFloat {
      0% { transform: translate(0, 0); opacity: 1; }
      100% { transform: translate(-30px, -40px); opacity: 0; }
    }
    .reticle { animation: pulseReticle 2s infinite ease-in-out; }
    .spark { animation: sparkFloat 2.5s infinite linear; }
    .title-text {
      font-family: 'Outfit', -apple-system, sans-serif;
      font-weight: 900;
      letter-spacing: 4px;
    }
    .mono-text {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      letter-spacing: 1.5px;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" stroke="rgba(255, 210, 0, 0.25)" stroke-width="2" />

  <!-- Subtle Cyber Grid -->
  <g stroke="rgba(255, 255, 255, 0.04)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="320" />
    <line x1="250" y1="0" x2="250" y2="320" />
    <line x1="400" y1="0" x2="400" y2="320" />
    <line x1="550" y1="0" x2="550" y2="320" />
    <line x1="700" y1="0" x2="700" y2="320" />
    <line x1="850" y1="0" x2="850" y2="320" />
    <line x1="1000" y1="0" x2="1000" y2="320" />
    <line x1="1150" y1="0" x2="1150" y2="320" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
  </g>

  <!-- Glowing Hand Tracking Icon -->
  <g transform="translate(140, 160)">
    <circle cx="0" cy="0" r="48" fill="rgba(255, 210, 0, 0.08)" stroke="#ffd200" stroke-width="2" filter="url(#subtleGlow)" />
    <circle cx="0" cy="0" class="reticle" fill="none" stroke="#00d2ff" stroke-width="2.5" />
    <text x="0" y="16" font-size="44" text-anchor="middle">🖐️</text>
  </g>

  <!-- Title & Branding -->
  <text x="240" y="145" class="title-text" font-size="64" fill="url(#goldGlow)" filter="url(#neonBlur)">AIRDIGIT AI</text>
  <text x="240" y="145" class="title-text" font-size="64" fill="#ffffff">AIRDIGIT AI</text>

  <text x="245" y="195" class="mono-text" font-size="20" fill="#00d2ff" filter="url(#subtleGlow)">
    MID-AIR HANDWRITING RECOGNITION · DEEP PYTORCH CNN · NEON HUD
  </text>

  <text x="245" y="235" font-family="'Outfit', sans-serif" font-size="16" fill="#8b949e">
    MediaPipe 21 Landmarks · Heavy Spatial Augmentation · Live 28×28 Feed · Math Solver Engine
  </text>

  <!-- Status Chip Badges -->
  <g transform="translate(245, 260)">
    <!-- Badge 1: 99.4% Accuracy -->
    <rect x="0" y="0" width="145" height="28" rx="14" fill="rgba(57, 255, 20, 0.12)" stroke="#39ff14" stroke-width="1.2" />
    <circle cx="16" cy="14" r="4" fill="#39ff14" />
    <text x="28" y="19" class="mono-text" font-size="11" fill="#39ff14">99.4% ACCURACY</text>

    <!-- Badge 2: MediaPipe Hands -->
    <rect x="155" y="0" width="165" height="28" rx="14" fill="rgba(255, 210, 0, 0.12)" stroke="#ffd200" stroke-width="1.2" />
    <circle cx="171" cy="14" r="4" fill="#ffd200" />
    <text x="183" y="19" class="mono-text" font-size="11" fill="#ffd200">MEDIAPIPE TRACKING</text>

    <!-- Badge 3: Realtime CPU -->
    <rect x="330" y="0" width="155" height="28" rx="14" fill="rgba(0, 210, 255, 0.12)" stroke="#00d2ff" stroke-width="1.2" />
    <circle cx="346" cy="14" r="4" fill="#00d2ff" />
    <text x="358" y="19" class="mono-text" font-size="11" fill="#00d2ff">REAL-TIME ON CPU</text>

    <!-- Badge 4: Web & Desktop -->
    <rect x="495" y="0" width="150" height="28" rx="14" fill="rgba(255, 51, 102, 0.12)" stroke="#ff3366" stroke-width="1.2" />
    <circle cx="511" cy="14" r="4" fill="#ff3366" />
    <text x="523" y="19" class="mono-text" font-size="11" fill="#ff3366">WEB + OPENCV APP</text>
  </g>

  <!-- Floating Spark Particles -->
  <circle cx="980" cy="110" r="3" fill="#ffd200" class="spark" filter="url(#subtleGlow)" />
  <circle cx="1020" cy="180" r="2.5" fill="#00d2ff" class="spark" style="animation-delay: 0.8s" filter="url(#subtleGlow)" />
  <circle cx="1060" cy="90" r="2" fill="#fff5be" class="spark" style="animation-delay: 1.5s" filter="url(#subtleGlow)" />
  <circle cx="940" cy="220" r="3.5" fill="#ffd200" class="spark" style="animation-delay: 1.2s" filter="url(#subtleGlow)" />

  <!-- Target Reticle Icon on Right -->
  <g transform="translate(1030, 160)">
    <circle cx="0" cy="0" r="54" fill="none" stroke="rgba(255, 210, 0, 0.2)" stroke-dasharray="6,6" stroke-width="2" />
    <circle cx="0" cy="0" r="36" fill="rgba(0, 210, 255, 0.05)" stroke="#00d2ff" stroke-width="1.5" />
    <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="32" font-weight="900" fill="#ffd200" text-anchor="middle">7</text>
  </g>
</svg>
