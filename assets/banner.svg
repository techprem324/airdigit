<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">AirDigit — a little room to think</title>
  <desc id="description">A warm paper-and-forest-green cover with a hand-drawn number seven.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f6ef"/>
      <stop offset="1" stop-color="#eaece2"/>
    </linearGradient>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dfe9df" stop-opacity=".85"/>
      <stop offset="1" stop-color="#dfe9df" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="18" fill="url(#paper)"/>
  <ellipse cx="144" cy="52" rx="280" ry="180" fill="url(#wash)"/>
  <path d="M0 292C220 248 304 353 521 299s337-42 679-14v75H0Z" fill="#e4e9df" opacity=".62"/>
  <g fill="none" stroke="#1f4d43" stroke-linecap="round" stroke-linejoin="round">
    <path d="M817 83h221l-119 192" stroke-width="13" opacity=".08" transform="translate(7 9)"/>
    <path d="M817 83h221l-119 192" stroke-width="8"/>
    <circle cx="817" cy="83" r="13" fill="#d6755d" stroke="none"/>
    <circle cx="919" cy="275" r="7" fill="#1f4d43" stroke="none"/>
    <path d="M790 62h-21m315 212h21M935 51V30" stroke-width="2" opacity=".28"/>
  </g>
  <circle cx="1038" cy="83" r="34" fill="none" stroke="#1f4d43" stroke-opacity=".14"/>
  <circle cx="1038" cy="83" r="48" fill="none" stroke="#1f4d43" stroke-opacity=".1" stroke-dasharray="2 7"/>
  <circle cx="1096" cy="227" r="3" fill="#d6755d"/>
  <circle cx="756" cy="231" r="3" fill="#d6755d" opacity=".7"/>
  <text x="74" y="187" fill="#202824" font-family="Georgia, serif" font-size="70" letter-spacing="-2">A little room</text>
  <text x="74" y="267" fill="#1f4d43" font-family="Georgia, serif" font-size="70" font-style="italic" letter-spacing="-2">to think.</text>
  <path d="M78 295h44" stroke="#d6755d" stroke-width="3" stroke-linecap="round"/>
  <text x="136" y="300" fill="#788078" font-family="Arial, sans-serif" font-size="14" letter-spacing="1">DRAW A DIGIT · SEE WHAT THE MODEL SEES</text>
